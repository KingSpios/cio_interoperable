    doLast {
        var source = new groovy.json.JsonSlurper().parse(commsRelayModel)
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var visor = "visor_plate"
        var knobs = ["knob_1", "knob_2"]
        ([visor] + knobs + ["body_box", "back_plate"]).each { name ->
            if (source.elements.find { it.name == name } == null) {
                throw new GradleException("comms_relay.json has no element named '${name}' (Radio Telephone Interconnect)")
            }
        }
        var write = { String path, Map json ->
            var out = outDir.get().file("assets/createinteroperable/${path}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
        var lifted = { Map element ->
            element.from = [element.from[0], element.from[1], element.from[2] + 0.01]
            element.to = [element.to[0], element.to[1], element.to[2] + 0.01]
            element
        }
        var texturesOf = { List elements ->
            var used = elements.collectMany { it.faces.values().collect { face -> face.texture.substring(1) } } as Set
            var t = source.textures.findAll { key, value -> key in used }
            t.particle = source.textures["2"]
