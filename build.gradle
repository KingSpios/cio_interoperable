// Fence-post brackets (pole/client/FenceMountRenderer): the Utility Pole's own bracket parts
// (tall: mid_block_mount + mid_bands; fixture plate: fixture_mount + fixture_bands), redrawn
// for a post that isn't a pole - a fence (4 px, the pole's own width: the parts unchanged), a
// wall or concrete pole (8 px) or iron bars (2 px). Bands wrap the post 1 px out and the arms
// run from them to the plate; everything else keeps its place. Faces stay 1 texel per pixel
// inside mount_south's painted area: a 2 px post's band is a solid 4x4 box (its corner), an
// 8 px post's a ring of four 1 px slabs (a solid 10x10 would sample the unpainted texels).
var fenceMountParts = ["mid_block_mount", "mid_bands", "fixture_mount", "fixture_bands"].collect {
    file("src/main/resources/assets/createinteroperable/models/block/utility_pole/${it}.json")
}
var generateFenceMountModels = tasks.register("generateFenceMountModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/fenceMountModels")
    inputs.files(fenceMountParts)
    outputs.dir(outDir)
    doLast {
        var slurp = { String name -> new groovy.json.JsonSlurper().parse(file("src/main/resources/assets/createinteroperable/models/block/utility_pole/${name}.json")) }
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var isBand = { e -> e.name != null && e.name.contains("band") }
        var isArm = { e -> e.name != null && e.name.contains("arm") }
        // A box's six faces, each uv starting at (u0, v0) and sized to its face: 1 texel per pixel.
        var box = { String name, List from, List to, int u0, int v0 ->
            var sx = to[0] - from[0], sy = to[1] - from[1], sz = to[2] - from[2]
            var face = { w, h -> [uv: [u0, v0, u0 + w, v0 + h], texture: "#6"] }
            [name: name, from: from, to: to,
             faces: [north: face(sx, sy), south: face(sx, sy), east: face(sz, sy), west: face(sz, sy),
                     up: face(sx, sz), down: face(sx, sz)]]
        }
        var band = { Map e, int post ->
            int y0 = e.from[1], y1 = e.to[1]
            int lo = 8 - post.intdiv(2) - 1, hi = 8 + post.intdiv(2) + 1
            if (post <= 4) {
                return [box(e.name, [lo, y0, lo], [hi, y1, hi], 0, 0).with { it.faces.each { k, f ->
                    // Sides take the band's own strip (row 1), as the pole's do.
                    if (!(k in ["up", "down"])) { f.uv = [0, 1, hi - lo, 2] } }; it }]
            }
            return [box(e.name, [lo, y0, lo], [hi, y1, lo + 1], 0, 2),
                    box(e.name, [lo, y0, hi - 1], [hi, y1, hi], 0, 2),
                    box(e.name, [lo, y0, lo + 1], [lo + 1, y1, hi - 1], 0, 2),
                    box(e.name, [hi - 1, y0, lo + 1], [hi, y1, hi - 1], 0, 2)]
        }
        var arm = { Map e, int post ->
            var a = copy(e)
            int start = 8 + post.intdiv(2) + 1, length = 15 - start
            a.from[2] = start
            a.faces.east.uv = [1, 0, 1 + length, 1]
            a.faces.west.uv = [1, 0, 1 + length, 1]
            a.faces.up.uv = [0, 1, 2, 1 + length]
            a.faces.down.uv = [0, 1, 2, 1 + length]
            return [a]
        }
        var posts = [fence: 4, wide: 8, thin: 2]
        var kinds = [block: ["mid_block_mount", "mid_bands"], fixture: ["fixture_mount", "fixture_bands"]]
        kinds.each { kind, parts ->
            var source = parts.collect { slurp(it) }
            var elements = source.collectMany { it.elements }
            if (!elements.any(isBand) || !elements.any(isArm)) {
                throw new GradleException("${parts}: expected band and arm elements (names with 'band' / 'arm')")
            }
            posts.each { postName, int post ->
                var out = elements.collectMany { e ->
                    post == 4 ? [copy(e)] : isBand(e) ? band(e, post) : isArm(e) ? arm(e, post) : [copy(e)]
                }
                var file = outDir.get().file("assets/createinteroperable/models/block/fence_mount/${kind}_${postName}.json").asFile
                file.parentFile.mkdirs()
                file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                        [credit: "Generated from utility_pole/${parts.join(' + ')} for a ${post} px post",
                         textures: source[0].textures, elements: out])), "UTF-8")
            }
        }
    }
}
