// Radio Goggles rings of emission (goggles/client/RadioRingRenderer): one model per ring
// texture in textures/block/radio_ring/ (ring_NxN.png, N blocks square, any whole number of
// px per block: 16 today), built only from quads over its non-transparent pixels, so no part
// of the square around the ring is drawn (an additive or emissive quad lights its transparent
// texels too under some shader packs). Each row's runs of lit pixels, stacked into rectangles
// where consecutive rows repeat the same run; every rectangle is a flat element facing up and
// down at y 8, centred on the block, UVs on exactly its pixels. Every ring also gets a
// greyscale twin, ring_rx_NxN (texture + model), for antennas receiving. Repaint the PNG and
// the geometry and the twin follow.
var radioRingTextures = file("src/main/resources/assets/createinteroperable/textures/block/radio_ring")
var generateRadioRingModels = tasks.register("generateRadioRingModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/radioRingModels")
    inputs.dir(radioRingTextures)
    outputs.dir(outDir)
    doLast {
        var round = { double v -> Math.round(v * 1.0e6) / 1.0e6 }
        var assets = outDir.get().dir("assets/createinteroperable").asFile
        var sources = radioRingTextures.listFiles().findAll { it.name ==~ /ring_(\d)x\1\.png/ }
        if (sources.isEmpty()) {
            throw new GradleException("no ring_NxN.png in ${radioRingTextures} (Radio Goggles)")
        }
        sources.each { File source ->
            int n = (source.name =~ /ring_(\d)x/)[0][1] as int
            var image = javax.imageio.ImageIO.read(source)
            int size = image.width
            int perBlock = size.intdiv(n)
            if (image.height != size || perBlock * n != size || perBlock < 1) {
                throw new GradleException("${source.name} must be square, a whole number of px per block for ${n} blocks (Radio Goggles)")
            }
            var rects = []       // [x0, x1, y0, y1], pixel edges
            var open = [:]       // [x0, x1] -> first row
            for (int y = 0; y <= size; y++) {
                var runs = []
                if (y < size) {
                    int x = 0
                    while (x < size) {
                        if ((image.getRGB(x, y) >>> 24) != 0) {
                            int x0 = x
                            while (x < size && (image.getRGB(x, y) >>> 24) != 0) {
                                x++
                            }
                            runs << [x0, x]
                        } else {
                            x++
                        }
                    }
                }
                var next = [:]
                runs.each { run -> next[run] = open.containsKey(run) ? open[run] : y }
                open.each { run, y0 -> if (!next.containsKey(run)) rects << [run[0], run[1], y0, y] }
                open = next
            }
            double unit = 16.0 / perBlock   // model units per pixel
            double origin = -8.0 * (n - 1)  // the square is centred on the block
            double uv = 16.0 / size
            var elements = rects.collect { r ->
                int x0 = r[0], x1 = r[1], y0 = r[2], y1 = r[3]
                [from: [round(origin + x0 * unit), 8, round(origin + y0 * unit)],
                 to: [round(origin + x1 * unit), 8, round(origin + y1 * unit)],
                 shade: false,
                 faces: [up: [uv: [round(x0 * uv), round(y0 * uv), round(x1 * uv), round(y1 * uv)], texture: "#ring"],
                         // a down face's v runs south to north: flipped so it shows the same pixels
                         down: [uv: [round(x0 * uv), round(y1 * uv), round(x1 * uv), round(y0 * uv)], texture: "#ring"]]]
            }
            var writeModel = { String name ->
                var texture = "createinteroperable:block/radio_ring/${name}".toString()
                var out = new File(assets, "models/block/radio_ring/${name}.json")
                out.parentFile.mkdirs()
                out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        ambientocclusion: false,
                        textures: [ring: texture, particle: texture],
                        elements: elements])), "UTF-8")
            }
            writeModel("ring_${n}x${n}")
            writeModel("ring_rx_${n}x${n}")

            // The greyscale twin: each pixel's luminance, alpha kept (the art is premultiplied for additive blending).
            var grey = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < size; y++) {
                for (int x = 0; x < size; x++) {
                    int argb = image.getRGB(x, y)
                    int l = Math.round(0.299f * ((argb >> 16) & 0xFF) + 0.587f * ((argb >> 8) & 0xFF) + 0.114f * (argb & 0xFF))
                    grey.setRGB(x, y, (int) (((argb >>> 24) << 24) | (l << 16) | (l << 8) | l)) // (0xFF000000 is a Long in Groovy)
                }
            }
            var greyFile = new File(assets, "textures/block/radio_ring/ring_rx_${n}x${n}.png")
            greyFile.parentFile.mkdirs()
            javax.imageio.ImageIO.write(grey, "png", greyFile)
        }
    }
}
