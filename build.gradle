// Radio Telephone (telephone/ccee): the artist's radio_telephone.json split by element
// name, plus its blockstate and item model. The body takes the paint (texture 3, one
// model per PowerKitPaint colour, sheets from generateDyedTextures); the two visor lids
// are their own part, glowing while the phone is powered (visor_lid_on + NeoForge's
// block/sky light 15); the frequency pointer is a partial RadioTelephoneRenderer turns.
var radioTelephoneModel = file("src/main/resources/assets/createinteroperable/models/block/radio_telephone.json")
var generateRadioTelephoneModels = tasks.register("generateRadioTelephoneModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/radioTelephoneModels")
    inputs.file(radioTelephoneModel)
    inputs.file(file("src/main/resources/assets/createinteroperable/models/item/cee_telephone.json"))
    outputs.dir(outDir)
    doLast {
        var source = new groovy.json.JsonSlurper().parse(radioTelephoneModel)
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var lids = ["info_plate_bottom_lid", "info_plate_top_lid"]
        var pointer = "freq_pointer"
        var dial = "freq_dial"
        (lids + [pointer, dial, "body_box", "body_box_back"]).each { name ->
            if (source.elements.find { it.name == name } == null) {
                throw new GradleException("radio_telephone.json has no element named '${name}' (Radio Telephone)")
            }
        }
        var write = { String path, Map json ->
            var out = outDir.get().file("assets/createinteroperable/${path}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
        // PowerKitPaint.Color, in order
        var paints = ["factory", "white", "orange", "magenta", "light_blue", "yellow", "lime", "pink", "gray",
                      "light_gray", "cyan", "purple", "blue", "brown", "green", "red", "black"]
        // The frequency knob turns as one piece (dial + pointer) about the dial's centre, so
        // the pointer is moved to stand on that centre: its foot on it, its width centred on
        // it. RadioTelephoneRenderer turns the knob about the same point.
        var dialElement = source.elements.find { it.name == dial }
        double dialY = (dialElement.from[1] + dialElement.to[1]) / 2.0
        double dialZ = (dialElement.from[2] + dialElement.to[2]) / 2.0
        var centred = { Map needle ->
            double dz = dialZ - (needle.from[2] + needle.to[2]) / 2.0
            double dy = dialY - needle.from[1]
            needle.from = [needle.from[0], needle.from[1] + dy, needle.from[2] + dz]
            needle.to = [needle.to[0], needle.to[1] + dy, needle.to[2] + dz]
            needle.remove("rotation") // the renderer does the turning
            needle
        }
        var body = source.elements.findAll { !(it.name in lids) && it.name != pointer && it.name != dial }
        paints.each { paint ->
            var textures = copy(source.textures)
            if (paint != "factory") {
                textures["3"] = "createinteroperable:block/radio_telephone/body_${paint}"
            }
            write("models/block/radio_telephone/body_${paint}",
                    [render_type: "minecraft:translucent", textures: textures, elements: copy(body)])
        }
        var lidTextures = ["1": source.textures["1"], "4": source.textures["4"], particle: source.textures["1"]]
        write("models/block/radio_telephone/lid", [render_type: "minecraft:translucent", textures: lidTextures,
                                                   elements: copy(source.elements.findAll { it.name in lids })])
        var glowing = copy(source.elements.findAll { it.name in lids }).each { element ->
            element.shade = false
            element.neoforge_data = [block_light: 15, sky_light: 15, ambient_occlusion: false]
        }
        write("models/block/radio_telephone/lid_on", [render_type: "minecraft:translucent",
                                                      textures: lidTextures + ["1": "createinteroperable:block/visor_lid_on"],
                                                      elements: glowing])
        var knob = [copy(dialElement), centred(copy(source.elements.find { it.name == pointer }))]
        knob[0].remove("rotation")
        var used = knob.collectMany { it.faces.values().collect { face -> face.texture.substring(1) } } as Set
        var knobTextures = source.textures.findAll { key, value -> key in used }
        knobTextures.particle = knobTextures[used.first()]
        write("models/block/radio_telephone/pointer", [textures: knobTextures, elements: knob])
        write("models/block/radio_telephone/full", [render_type: "minecraft:translucent", textures: copy(source.textures),
                                                    elements: copy(source.elements).collect { it.name == pointer ? centred(it) : it }])
        // Same in-hand / inventory framing as the other telephones.
        var display = new groovy.json.JsonSlurper().parse(file("src/main/resources/assets/createinteroperable/models/item/cee_telephone.json")).display
        write("models/item/radio_telephone", [parent: "createinteroperable:block/radio_telephone/full", display: display])
        var facings = [north: 0, east: 90, south: 180, west: 270]
        var parts = []
        facings.each { facing, y ->
            paints.each { paint ->
                parts << [when: [facing: facing, color: paint], apply: [model: "createinteroperable:block/radio_telephone/body_${paint}", y: y]]
            }
            parts << [when: [facing: facing, powered: "false"], apply: [model: "createinteroperable:block/radio_telephone/lid", y: y]]
            parts << [when: [facing: facing, powered: "true"], apply: [model: "createinteroperable:block/radio_telephone/lid_on", y: y]]
        }
        write("blockstates/radio_telephone", [multipart: parts])
    }
}
