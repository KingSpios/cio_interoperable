// Dyed textures (Power Kit panels, telephones): one sheet per Minecraft dye from
// a neutral (white) sheet, a paint mask and src/main/dyeable/palette.json — see
// targets.json there. Painted pixels take the dye scaled by their own brightness
// against the panel's average, so the neutral's noise carries over.
var dyeableDir = file("src/main/dyeable")
var generateDyedTextures = tasks.register("generateDyedTextures") {
    var outDir = layout.buildDirectory.dir("generated/sources/dyedTextures")
    inputs.dir(dyeableDir)
    inputs.dir("src/main/resources/assets/createinteroperable/textures/block")
    outputs.dir(outDir)
    doLast {
        var assets = file("src/main/resources/assets/createinteroperable")
        var read = { String path ->
            javax.imageio.ImageIO.read(path.startsWith("dyeable:") ? new File(dyeableDir, path.substring(8)) : new File(assets, path))
        }
        var lum = { int argb -> 0.299 * ((argb >> 16) & 0xFF) + 0.587 * ((argb >> 8) & 0xFF) + 0.114 * (argb & 0xFF) }
        var clamp = { double v -> Math.max(0, Math.min(255, (int) Math.round(v))) }
        var palette = new groovy.json.JsonSlurper().parse(new File(dyeableDir, "palette.json"))
        var config = new groovy.json.JsonSlurper().parse(new File(dyeableDir, "targets.json"))
        config.targets.each { target ->
            var base = read(target.base)
            var neutral = read(target.neutral)
            var mask = read("dyeable:" + target.mask)
            int w = base.width, h = base.height
            // the painted panel's average brightness and its brightest pixel, relative to it
            var painted = []
            for (int x = 0; x < w; x++) for (int y = 0; y < h; y++) if (((mask.getRGB(x, y) >> 16) & 0xFF) > 0) painted << lum(neutral.getRGB(x, y))
            double mean = painted.sum() / painted.size()
            double brightest = painted.max() / mean
            // how much the paint covers the neutral; the rest is the neutral's own texture showing through
            double opacity = target.opacity != null ? (target.opacity as double) : 1.0
            palette.each { String dye, String hex ->
                int rgb = Integer.parseInt(hex.substring(1), 16)
                double[] colour = [(rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF] as double[]
                double peak = colour.max()
                // a near-white dye would clip the bright pixels flat: keep their noise
                double headroom = Math.min(1, 255 / (peak * brightest))
                var out = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int x = 0; x < w; x++) {
                    for (int y = 0; y < h; y++) {
                        int m = mask.getRGB(x, y)
                        int paint = (m >> 16) & 0xFF, glaze = (m >> 8) & 0xFF, accent = m & 0xFF
                        int n = neutral.getRGB(x, y)
                        double[] np = [(n >> 16) & 0xFF, (n >> 8) & 0xFF, n & 0xFF] as double[]
                        int argb
                        if (paint > 0) {
                            double f = lum(n) / mean * headroom
                            argb = (n & 0xFF000000) | ((0..2).collect { i -> clamp(np[i] * (1 - opacity) + colour[i] * f * opacity) }
                                    .inject(0) { acc, c -> (acc << 8) | c })
                        } else if (glaze > 0) {
                            double k = glaze / 255.0
                            argb = (n & 0xFF000000) | ((0..2).collect { i -> clamp(np[i] * (1 - k + k * colour[i] / 255)) }
                                    .inject(0) { acc, c -> (acc << 8) | c })
                        } else if (accent > 0) {
                            double k = accent / 255.0
                            argb = (n & 0xFF000000) | ((0..2).collect { i -> clamp(np[i] * (1 - k) + colour[i] * 255 / peak * k) }
                                    .inject(0) { acc, c -> (acc << 8) | c })
                        } else {
                            argb = base.getRGB(x, y)
                        }
                        out.setRGB(x, y, argb)
                    }
                }
                var name = target.names?.get(dye) ?: dye
                var file = outDir.get().file("assets/createinteroperable/" + String.format(target.out, name)).asFile
                file.parentFile.mkdirs()
                javax.imageio.ImageIO.write(out, "png", file)
            }
        }
    }
}
