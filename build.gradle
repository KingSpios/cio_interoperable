        write("models/block/cee_style_inverter/button", [textures: textures, elements: [unrotated(source.elements.find { it.name == button })]])
        write("models/block/cee_style_inverter/full", [render_type: "minecraft:cutout", textures: textures, elements: copy(source.elements)])
        write("models/item/cee_style_inverter", [parent: "createinteroperable:block/cee_style_inverter/full", display: copy(source.display)])
