            element.from = [element.from[0], element.from[1], element.from[2] + 0.01]
            element.to = [element.to[0], element.to[1], element.to[2] + 0.01]
            element
        }
        var texturesOf = { List elements ->
            var used = elements.collectMany { it.faces.values().collect { face -> face.texture.substring(1) } } as Set
            var t = source.textures.findAll { key, value -> key in used }
            t.particle = source.textures["2"]
            t
        }
        var unrotated = { Map element ->
            var e = copy(element)
            e.remove("rotation")
            e
        }
        var body = source.elements.findAll { !(it.name in [visor, knob, button]) }
        write("models/block/cee_inverter/body", [render_type: "minecraft:cutout", textures: texturesOf(body), elements: copy(body)])
        var visorElement = source.elements.find { it.name == visor }
        write("models/block/cee_inverter/visor_off", [render_type: "minecraft:cutout",
                                                      textures: texturesOf([visorElement]),
                                                      elements: [lifted(copy(visorElement))]])
        var lit = lifted(copy(visorElement))
        lit.shade = false
        lit.neoforge_data = [block_light: 15, sky_light: 15, ambient_occlusion: false]
        write("models/block/cee_inverter/visor_on", [render_type: "minecraft:cutout",
                                                     textures: texturesOf([visorElement]) + ["5": "createinteroperable:block/comms_relay/visor_on"],
                                                     elements: [lit]])
        var knobElement = unrotated(source.elements.find { it.name == knob })
        write("models/block/cee_inverter/knob", [textures: texturesOf([knobElement]), elements: [knobElement]])
        var buttonElement = unrotated(source.elements.find { it.name == button })
        write("models/block/cee_inverter/button", [textures: texturesOf([buttonElement]), elements: [buttonElement]])
        write("models/block/cee_inverter/full", [render_type: "minecraft:cutout", textures: copy(source.textures) + [particle: source.textures["2"]],
                                                 elements: copy(source.elements).collect { it.name == visor ? lifted(it) : it }])
        // The model faces south, as the interconnect's: the same item framing.
        write("models/item/cee_inverter", [parent: "createinteroperable:block/cee_inverter/full", display: [
                gui: [rotation: [30, 45, 0], translation: [3.4, -1.7, 0], scale: [0.8, 0.8, 0.8]],
                ground: [rotation: [0, 0, 0], translation: [0, 3, 0], scale: [0.25, 0.25, 0.25]],
                fixed: [rotation: [0, 180, 0], translation: [0, 0, 0], scale: [0.5, 0.5, 0.5]],
                thirdperson_righthand: [rotation: [75, 225, 0], translation: [0, 2.5, 0], scale: [0.375, 0.375, 0.375]],
                firstperson_righthand: [rotation: [0, 225, 0], translation: [0, 0, 0], scale: [0.4, 0.4, 0.4]],
                firstperson_lefthand: [rotation: [0, 45, 0], translation: [0, 0, 0], scale: [0.4, 0.4, 0.4]]]])
        // InverterBlock.angleFor: the model faces south.
        var facings = [south: 0, west: 90, north: 180, east: 270]
        var parts = []
        facings.each { facing, y ->
            parts << [when: [facing: facing], apply: [model: "createinteroperable:block/cee_inverter/body", y: y]]
            parts << [when: [facing: facing, powered: "false"], apply: [model: "createinteroperable:block/cee_inverter/visor_off", y: y]]
            parts << [when: [facing: facing, powered: "true"], apply: [model: "createinteroperable:block/cee_inverter/visor_on", y: y]]
        }
        write("blockstates/cee_inverter", [multipart: parts])
    }
