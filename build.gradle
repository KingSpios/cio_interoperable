        lit.shade = false
        lit.neoforge_data = [block_light: 15, sky_light: 15, ambient_occlusion: false]
        write("models/block/comms_relay/visor_on", [render_type: "minecraft:cutout",
                                                    textures: texturesOf([visorElement]) + ["5": "createinteroperable:block/comms_relay/visor_on"],
                                                    elements: [lit]])
        var knob = copy(source.elements.find { it.name == knobs[0] })
        knob.remove("rotation")
        write("models/block/comms_relay/knob", [textures: texturesOf([knob]), elements: [knob]])
        write("models/block/comms_relay/full", [render_type: "minecraft:cutout", textures: copy(source.textures) + [particle: source.textures["2"]],
                                                elements: copy(source.elements).collect { it.name == visor ? lifted(it) : it }])
        // The model faces south: the telephones' framing turned half round.
        write("models/item/comms_relay", [parent: "createinteroperable:block/comms_relay/full", display: [
                // Translation centres the projected box (12 x 16 x 4, centred at x 8, z 2) in the slot:
                // the old [2.5, 0] sat ~1.7 px high and ~0.9 px left.
                gui: [rotation: [30, 45, 0], translation: [3.4, -1.7, 0], scale: [0.8, 0.8, 0.8]],
