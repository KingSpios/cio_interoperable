                fixed: [rotation: [0, 180, 0], translation: [0, 0, 0], scale: [0.5, 0.5, 0.5]],
                thirdperson_righthand: [rotation: [75, 225, 0], translation: [0, 2.5, 0], scale: [0.375, 0.375, 0.375]],
                firstperson_righthand: [rotation: [0, 225, 0], translation: [0, 0, 0], scale: [0.4, 0.4, 0.4]],
                firstperson_lefthand: [rotation: [0, 45, 0], translation: [0, 0, 0], scale: [0.4, 0.4, 0.4]]]])
        // CommsRelayBlock.angleFor: the model faces south.
        var facings = [south: 0, west: 90, north: 180, east: 270]
        var parts = []
        facings.each { facing, y ->
            parts << [when: [facing: facing], apply: [model: "createinteroperable:block/comms_relay/body", y: y]]
            parts << [when: [facing: facing, powered: "false"], apply: [model: "createinteroperable:block/comms_relay/visor_off", y: y]]
            parts << [when: [facing: facing, powered: "true"], apply: [model: "createinteroperable:block/comms_relay/visor_on", y: y]]
        }
        write("blockstates/comms_relay", [multipart: parts])
    }
}
