plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.89'
    id 'idea'
}

// Release channel: the experimental branch carries a one-line `release-channel`
// file ("experimental"); main has none. A channel suffixes the version, so the
// branches build distinguishable jars (createinteroperable-<v>.jar vs
// createinteroperable-<v>-experimental.jar) and the game shows which is loaded.
// Kept in a file only that branch has, so version bumps never conflict.
def releaseChannelFile = file('release-channel')
def releaseChannel = releaseChannelFile.exists() ? releaseChannelFile.text.trim() : ''
version = releaseChannel ? "${mod_version}-${releaseChannel}" : mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Editor sources and scratch art live next to the real assets while being worked on; they don't ship.
tasks.named('processResources') {
    exclude '**/*.bbmodel', '**/*.psd', '**/_wip/**', '**/*.wip.png'
}

repositories {
    // Create, Ponder, Flywheel
    maven { url = "https://maven.createmod.net" }
    // Architectury API — Power Grid's own neoforge.mods.toml on the
    // architectury-1.21.1/dev branch declares this as a REQUIRED runtime
    // mod dependency (confirmed by reading that file directly), so without
    // it Power Grid itself refuses to load, silently breaking the bridge.
    maven { url = "https://maven.architectury.dev/" }
    // CurseForge-hosted mods that don't publish their own maven — used below
    // for Power Grid and Create: Electro Energetics. Requires the CurseForge
    // Maven Gradle plugin's terms; see https://cursemaven.com
    maven { url = "https://cursemaven.com" }
    // Modrinth's maven mirror, alternative source for the same jars
    maven { url = "https://api.modrinth.com/maven" }
    // Create: Pipes n Physics (de.devin.pipesnphysics) doesn't publish to
    // CurseForge/Modrinth — its own README points at JitPack, which builds
    // straight from its GitHub tags. See gradle.properties for the exact tag.
    maven { url = "https://jitpack.io" }
    // Simple Voice Chat's API artifact (compileOnly below).
    maven { url = "https://maven.maxhenkel.de/repository/public" }
    // CC: Tweaked's API artifacts (compileOnly below).
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup "cc.tweaked" }
    }
    // JUnit / ASM / Gson for the load-safety bytecode test (test scope only).
    mavenCentral()
}

// Compile-only signature stubs of the ComputerCraft CEE Addon classes CIO calls (see the
// dependency block below). Compiled against Minecraft + CC's API + Electro Energetics,
// put on main's compile classpath only, never into the jar.
sourceSets {
    ccceStubs {
        java.srcDir "src/ccceStubs/java"
    }
}
neoForge.addModdingDependenciesTo(sourceSets.ccceStubs)

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    // Create's SmartBlockEntity (which PG's own ElectricBlockEntity extends,
    // and which our InteroperableBlockEntity extends transitively) reaches
    // into Ponder's VirtualBlockEntity. transitive=false above means we have
    // to pull this in ourselves — confirmed necessary by an actual compile
    // failure ("class file for net.createmod.ponder.api.VirtualBlockEntity
    // not found"), not just copied preemptively from CEE's build.gradle.
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    // Not yet confirmed necessary by a compile error the way Ponder was —
    // added preemptively since CEE's own build.gradle needs both together.
    // If compilation succeeds without it, feel free to drop this line.
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")

    // Required at runtime by Power Grid (see repositories block above).
    // Not something our own code compiles against directly — this is here
    // purely so `runClient`/`runServer` don't fail with a missing-dependency
    // screen when Power Grid is also present.
    runtimeOnly "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // --- Power Grid ---------------------------------------------------
    // Power Grid, project 1321420, file 8648636 = version 0.6.0.1 (NeoForge
    // 1.21.1, uploaded 2026-08-14) — the newest published build, and close
    // to the 0.6.1 architectury-1.21.1/dev HEAD this addon's code was
    // verified against. implementation (not compileOnly) so Gradle actually
    // puts it on the runClient/runServer classpath for local testing.
    implementation "curse.maven:power-grid-1321420:8648636"

    // --- Create: Electro Energetics ------------------------------------
    // Project 1443327, file 8345582 = version 1.1.1 (NeoForge 1.21.1,
    // uploaded 2026-06-30) — the newest published build. NOTE: the source
    // this addon's code was verified against was the 1.21.1 git branch HEAD,
    // whose gradle.properties reports mod_version 1.21.1-1.2.0 — i.e. ahead
    // of this published 1.1.1 jar. SimpleElectricalDevice / BridgeCollector /
    // SimulationResults are foundational classes unlikely to have shifted,
    // but if compilation fails on a missing method, that version gap is the
    // first thing to check.
    implementation "curse.maven:create-electro-energetics-1443327:8345582"

    // --- MrCrayfish's Furniture Mod: Refurbished ----------------------
    // com.mrcrayfish.furniture.refurbished. Project 897116, file 7473565 =
    // refurbished_furniture-neoforge-1.21.1-1.0.22.jar (NeoForge 1.21.1,
    // uploaded 2026-01-17), the newest 1.21.1 NeoForge build. Optional at
    // runtime (mods.toml): when installed, the Power Kits
    // (com.cio.createinteroperable.powerkit) become Crayfish ISourceNodes via
    // the *crayfish* mixin configs and feed its appliance node graph; without
    // it CIO's own appliance grid does the job. The multi-
    // loader mod shades its `common` electricity package (IElectricityNode /
    // ISourceNode / Connection / ElectricityTicker) into this NeoForge jar.
    implementation "curse.maven:refurbished-furniture-897116:7473565"

    // --- Cold Sweat -----------------------------------------------------
    // com.momosoftworks.coldsweat, mod id "cold_sweat". Soft (optional)
    // dependency — see Mods.COLD_SWEAT/ColdSweatIntegration and the note in
    // gradle.properties on why this is real Java registration (via the
    // public BlockTempRegisterEvent), not a datapack JSON. Cold Sweat 2.4.3
    // (2026-09-13) deleted BlockTemp's old static-value constructor outright
    // (moved to per-call getter overrides, with a new SimpleBlockTemp
    // subclass preserving the old constructor shape) — a real breaking API
    // change, confirmed by reading the upstream commit, that crashed 0.1.50
    // against a user's Cold Sweat 2.4.3.1 with NoSuchMethodError inside
    // ColdSweatHeatTemp's construction. No longer on Modrinth (still only
    // 2.4.2 there as of 2026-09-22) — fetched from CurseForge instead:
    // project 506194, file 8888797 = ColdSweat-2.4.3.1.jar (NeoForge,
    // MC 1.21.1, uploaded 2026-09-15), matching the exact jar this addon's
    // code is now verified against. See gradle.properties for the raised
    // minimum-supported-version floor that goes with this bump.
    implementation "curse.maven:cold-sweat-506194:8888797"

    // --- Create: Pipes n Physics -----------------------------------------
    // de.devin.pipesnphysics, mod id "pipesnphysics". Soft (optional) dependency:
    // compileOnly so it's never required at runtime — see Mods.PIPES_N_PHYSICS/PipesNPhysicsIntegration.
    // Built by JitPack straight from the GitHub tag (see the repositories block
    // above), matching the exact jar this addon's code was verified against
    // (pipesnphysics-3.2.1.jar, z_reference_mods/create-pipes-n-physics-main).
    compileOnly "com.github.StaticFX:create-pipes-n-physics:${pipes_n_physics_version}"

    // --- Simple Voice Chat ------------------------------------------------
    // Soft (optional) dependency: only the API jar, compileOnly, so nothing of it is
    // required at runtime. com.cio.createinteroperable.voice.CioVoicechatPlugin is the
    // only class that touches it, and Simple Voice Chat only instantiates that class
    // when it is installed.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    // --- CC: Tweaked + the ComputerCraft CEE Addon -------------------------
    // Both optional: compileOnly, so nothing of either is required at runtime.
    // Only com.cio.createinteroperable.computer.ccee, modules.ComputerModule and the
    // mixin.ccee packages touch them, all gated on both mods (and Electro Energetics,
    // which the addon itself requires). The addon is on no maven, so CIO compiles
    // against signature stubs of the handful of its classes it calls (src/ccceStubs,
    // never packaged); its real classes are what run in game.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    compileOnly sourceSets.ccceStubs.output
    ccceStubsCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    ccceStubsCompileOnly "curse.maven:create-electro-energetics-1443327:8345582"

    // --- Immersive Vehicles (formerly MTS) -----------------------------
    // PURELY EXPERIMENTAL integration, experimental branch only.
    // Mod id "mts". Soft (optional) dependency: compileOnly, pulled from
    // Modrinth's maven (repository above) at the exact jar installed for
    // testing. Only com.cio.createinteroperable.mts.MtsAaSearchlights and the
    // mixin.mts package touch its classes, and both only ever load with it
    // present (MtsMixinPlugin / Mods.IMMERSIVE_VEHICLES gates).
    compileOnly "maven.modrinth:immersive-vehicles:${immersive_vehicles_version}"

    // --- Load-safety test (src/test) ------------------------------------
    // Reads CIO's compiled bytecode plus the compile classpath with ASM; it
    // never loads a Minecraft class, so no game environment is needed.
    testImplementation platform("org.junit:junit-bom:5.10.1")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.ow2.asm:asm:9.8"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

// InverterAcSolveTest runs Electro Energetics' own circuit solver off-line, which uses Minecraft's
// BlockPos and fastutil: the tests see what the main code compiles against (no game is started).
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// --- Dedicated-server smoke test --------------------------------------------
// ./gradlew smokeTest boots a real NeoForge dedicated server once per mod set
// in src/smoke/profiles.txt (CIO alone, PG only, CEE only, both, + Crayfish,
// + Iden, ...) and fails unless each reaches "Done" with no crash, no
// CIO-related class-loading/mixin error, and exactly the expected CIO modules
// enabled. Not part of `build` (it takes minutes). Options:
//   -PcioSmokeAcceptEula=true   required: accepts the Minecraft EULA for the test server
//   -PcioSmokeModsDir=<dir>     where the mod jars come from (default: the Testing instance)
//   -PcioSmokeProfiles=a,b      run only these profiles
//   -PcioSmokeNeoForge=<ver>    server NeoForge version (default: the Testing instance's;
//                               some mods, e.g. Iden's Decor, need newer than neo_version)
// The server is installed once into runs/smoke-server (gitignored, survives clean).
sourceSets {
    smoke {
        java.srcDir "src/smoke/java"
    }
}

tasks.register("smokeTest", JavaExec) {
    group = "verification"
    description = "Boots dedicated servers on reduced mod sets to check CIO's optional-mod gating."
    dependsOn tasks.named("jar")
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = "com.cio.createinteroperable.smoke.SmokeRunner"
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def jarFile = tasks.named("jar").flatMap { it.archiveFile }
    def modsDir = providers.gradleProperty("cioSmokeModsDir").orElse("E:/Minecraft Neoforge Builds/1.21.1 Testing/mods")
    def profiles = providers.gradleProperty("cioSmokeProfiles").orElse("")
    def eula = providers.gradleProperty("cioSmokeAcceptEula").orElse("false")
    def serverDir = file("runs/smoke-server")
    def profilesFile = file("src/smoke/profiles.txt")
    def neo = providers.gradleProperty("cioSmokeNeoForge").orElse("21.1.248")
    argumentProviders.add({
        ["--server-dir=${serverDir.absolutePath}",
         "--mods-dir=${modsDir.get()}",
         "--cio-jar=${jarFile.get().asFile.absolutePath}",
         "--neoforge-version=${neo.get()}",
         "--profiles=${profilesFile.absolutePath}",
         "--only=${profiles.get()}",
         "--accept-eula=${eula.get()}"].collect { it.toString() }
    } as CommandLineArgumentProvider)
}

// LoadSafetyTest checks, from bytecode alone, the rule that keeps CIO loadable
// on any mod set: optional-mod types are only touched by classes gated on that
// mod, and common classes never touch client-only types. See the test's doc.
tasks.named("test", Test) {
    useJUnitPlatform()
    def mainClasses = sourceSets.main.output.classesDirs
    def mainCompileClasspath = sourceSets.main.compileClasspath
    def mainResources = file("src/main/resources")
    inputs.files(mainClasses).withPropertyName("cioClasses")
    inputs.files(mainCompileClasspath).withPropertyName("cioCompileClasspath")
    inputs.dir(mainResources).withPropertyName("cioResources")
    jvmArgumentProviders.add({
        ["-Dcio.classes=${mainClasses.asPath}",
         "-Dcio.compileClasspath=${mainCompileClasspath.asPath}",
         "-Dcio.resources=${mainResources.absolutePath}"].collect { it.toString() }
    } as CommandLineArgumentProvider)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            neo_version                     : neo_version,
            neo_version_range               : neo_version_range,
            loader_version_range            : loader_version_range,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : version,
            mod_authors                     : mod_authors,
            mod_credits                     : mod_credits,
            mod_description                 : mod_description,
            create_version_range            : create_version_range,
            power_grid_version_range        : power_grid_version_range,
            electro_energetics_version_range: electro_energetics_version_range,
            refurbished_furniture_version_range: refurbished_furniture_version_range,
            cold_sweat_version_range        : cold_sweat_version_range,
            pipes_n_physics_version_range   : pipes_n_physics_version_range,
            voicechat_version_range         : voicechat_version_range,
            cc_tweaked_version_range        : cc_tweaked_version_range,
            ccee_addon_version_range        : ccee_addon_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Power Kit master switches (PowerKitSwitch): each OFF pose is the artist's own
// model with one named element shifted, generated here rather than committed so
// a Blockbench re-export of the ON model can never leave a stale OFF copy behind.
// model -> [element name, dx, dy, dz] in model pixels, plus an optional new
// rotation angle for the element (a lever that tips rather than slides).
var powerKitSwitchPoses = [
        deb_rectifier_tier_1: ["flip_switch_lever", 0, 0, 0, 22.5], // flip switch tips from up (-22.5) to down
        deb_rectifier_tier_2: ["plate_switch", 0, -1, 0],     // slide switch drops 1 px
        deb_rectifier_tier_3: ["e_stop_button", -0.4, 0, 0],  // E-Stop retreats 0.4 px west (0.5 left it flush with its plate: z-fighting)
]
var powerKitModelDir = file("src/main/resources/assets/createinteroperable/models/block")
var generatePowerKitSwitchModels = tasks.register("generatePowerKitSwitchModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/powerKitSwitchModels")
    inputs.files(powerKitSwitchPoses.keySet().collect { new File(powerKitModelDir, "${it}.json") })
    inputs.property("poses", powerKitSwitchPoses.toString())
    outputs.dir(outDir)
    doLast {
        powerKitSwitchPoses.each { model, pose ->
            var json = new groovy.json.JsonSlurper().parse(new File(powerKitModelDir, "${model}.json"))
            var element = json.elements.find { it.name == pose[0] }
            if (element == null) {
                throw new GradleException("${model}.json has no element named '${pose[0]}' (Power Kit switch pose)")
            }
            var delta = pose[1..3]
            element.from = (0..2).collect { element.from[it] + delta[it] }
            element.to = (0..2).collect { element.to[it] + delta[it] }
            if (element.rotation?.origin != null) {
                element.rotation.origin = (0..2).collect { element.rotation.origin[it] + delta[it] }
            }
            if (pose.size() > 4) {
                element.rotation.angle = pose[4]
            }
            var out = outDir.get().file("assets/createinteroperable/models/block/${model}_off.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir generatePowerKitSwitchModels
neoForge.ideSyncTask generatePowerKitSwitchModels

// Tier-1 needle: the renderer spins this sub-model (block/power_kit/pointer) about
// clock_pin, so it is cut out of the artist's deb_rectifier_tier_1.json by element
// name rather than kept as a second copy that goes stale on a re-export (it did,
// after the model's new texture sheet). Only the textures the element uses are kept.
var generatePowerKitPointerModel = tasks.register("generatePowerKitPointerModel") {
    var outDir = layout.buildDirectory.dir("generated/sources/powerKitPointerModel")
    var tier1 = new File(powerKitModelDir, "deb_rectifier_tier_1.json")
    inputs.file(tier1)
    outputs.dir(outDir)
    doLast {
        var json = new groovy.json.JsonSlurper().parse(tier1)
        var element = json.elements.find { it.name == "pointer_facing_up" }
        if (element == null) {
            throw new GradleException("deb_rectifier_tier_1.json has no element named 'pointer_facing_up' (Power Kit needle)")
        }
        element.remove("rotation") // the renderer does the turning
        var used = element.faces.values().collect { it.texture.substring(1) } as Set
        var textures = json.textures.findAll { key, value -> key in used }
        textures.particle = textures[used.first()]
        var out = outDir.get().file("assets/createinteroperable/models/block/power_kit/pointer.json").asFile
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                [credit: "pointer_facing_up element of deb_rectifier_tier_1, generated for the needle spin", textures: textures, elements: [element]])), "UTF-8")
    }
}
sourceSets.main.resources.srcDir generatePowerKitPointerModel
neoForge.ideSyncTask generatePowerKitPointerModel

// Mini Grid Coupler (bridge/MiniGridCoupler*): the artist's mini_grid_coupler_tier_1.json
// split by element name. The block models drop the two parts the renderer turns
// (pointer_facing_up = load needle, indicator_lever = flow indicator) and come in
// four looks: switch on/off x intact/burnt (burnt = texture #9 swapped for
// mini_coupler_burnt). The glass lid is translucent, so every model is too.
var miniGridCouplerModel = file("src/main/resources/assets/createinteroperable/models/block/mini_grid_coupler_tier_1.json")
var generateMiniGridCouplerModels = tasks.register("generateMiniGridCouplerModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/miniGridCouplerModels")
    inputs.file(miniGridCouplerModel)
    outputs.dir(outDir)
    doLast {
        var source = new groovy.json.JsonSlurper().parse(miniGridCouplerModel)
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var animated = ["pointer_facing_up", "indicator_lever"]
        animated.each { name ->
            if (source.elements.find { it.name == name } == null) {
                throw new GradleException("mini_grid_coupler_tier_1.json has no element named '${name}' (Mini Grid Coupler)")
            }
        }
        if (source.elements.find { it.name == "flip_switch_lever" } == null) {
            throw new GradleException("mini_grid_coupler_tier_1.json has no element named 'flip_switch_lever' (Mini Grid Coupler)")
        }
        var write = { String path, Map json ->
            var out = outDir.get().file("assets/createinteroperable/models/${path}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
        var model = { boolean on, boolean burnt ->
            var textures = copy(source.textures)
            if (burnt) {
                textures["9"] = "createinteroperable:block/mini_coupler_burnt"
            }
            var elements = copy(source.elements.findAll { !(it.name in animated) })
            if (!on) {
                elements.find { it.name == "flip_switch_lever" }.rotation.angle = 22.5 // tips down
            }
            [render_type: "minecraft:translucent", textures: textures, elements: elements]
        }
        write("block/mini_grid_coupler/body", model(true, false))
        write("block/mini_grid_coupler/body_off", model(false, false))
        write("block/mini_grid_coupler/body_burnt", model(true, true))
        write("block/mini_grid_coupler/body_burnt_off", model(false, true))
        // The item shows the whole model, needle and indicator included.
        write("block/mini_grid_coupler/full", [render_type: "minecraft:translucent", textures: copy(source.textures), elements: copy(source.elements)])
        animated.each { name ->
            var element = copy(source.elements.find { it.name == name })
            element.remove("rotation") // the renderer does the turning
            var used = element.faces.values().collect { it.texture.substring(1) } as Set
            var textures = source.textures.findAll { key, value -> key in used }
            textures.particle = textures[used.first()]
            write("block/mini_grid_coupler/${name == "pointer_facing_up" ? "pointer" : "indicator"}",
                    [textures: textures, elements: [element]])
        }
    }
}
sourceSets.main.resources.srcDir generateMiniGridCouplerModels
neoForge.ideSyncTask generateMiniGridCouplerModels

// Utility Pole transformer bracket (pole/UtilityPoleModel Part.TRANSFORMER_MOUNT /
// TRANSFORMER_BANDS): the artist's utility_pole_transformer_mount.json split by element
// name into the two part models the pole assembles. Bands go in their own part, drawn once
// however many sides carry the bracket; the two at y 1-2 and 14-15 are left out because
// they are the MID's own bands, which a transformer bracket switches on. Every face takes
// mount_south_full, whatever path Blockbench saved for it.
var utilityPoleTransformerMount = file("src/main/resources/assets/createinteroperable/models/block/utility_pole_transformer_mount.json")
var generateUtilityPoleTransformerMount = tasks.register("generateUtilityPoleTransformerMount") {
    var outDir = layout.buildDirectory.dir("generated/sources/utilityPoleTransformerMount")
    inputs.file(utilityPoleTransformerMount)
    outputs.dir(outDir)
    doLast {
        var source = new groovy.json.JsonSlurper().parse(utilityPoleTransformerMount)
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var textures = ["2": "createinteroperable:block/utility_pole/mount_south_full",
                        particle: "createinteroperable:block/utility_pole/oak_tree16"]
        var isBand = { e -> e.name != null && e.name.contains("band") }
        var isMidBand = { e -> (e.from[1] == 1 && e.to[1] == 2) || (e.from[1] == 14 && e.to[1] == 15) }
        var mount = copy(source.elements.findAll { !isBand(it) })
        var bands = copy(source.elements.findAll { isBand(it) && !isMidBand(it) })
        if (mount.isEmpty() || bands.isEmpty()) {
            throw new GradleException("utility_pole_transformer_mount.json: expected bracket and band elements (names with 'band')")
        }
        [mount, bands].flatten().each { e -> e.faces.values().each { it.texture = "#2"; it.remove("cullface") } }
        var write = { String name, List elements ->
            var out = outDir.get().file("assets/createinteroperable/models/block/utility_pole/${name}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([textures: textures, elements: elements])), "UTF-8")
        }
        write("transformer_mount", mount)
        write("transformer_bands", bands)
    }
}
