// Embedded Connector (embedded/): the artist's embedded_connector.json, split by
// element name into the parts its blockstates combine, generated here so a
// Blockbench re-export is the only file to touch. "copy_walls" are drawn from
// the casing's block at runtime (EmbeddedConnectorModel), so the block parts
// leave them out and only the item models keep them, in polished andesite.
// The open lid is the closed lid turned about flat_lid's own pivot by NeoForge's
// root transform (vanilla element rotations stop at 45 degrees).
var embeddedConnectorModel = file("src/main/resources/assets/createinteroperable/models/block/embedded_connector.json")
var embeddedConnectorLidOpenDegrees = 120
var generateEmbeddedConnectorModels = tasks.register("generateEmbeddedConnectorModels") {
    var outDir = layout.buildDirectory.dir("generated/sources/embeddedConnectorModels")
    inputs.file(embeddedConnectorModel)
    inputs.property("lidOpenDegrees", embeddedConnectorLidOpenDegrees)
    outputs.dir(outDir)
    doLast {
        var source = new groovy.json.JsonSlurper().parse(embeddedConnectorModel)
        // element name -> part (an unnamed element is an error: name it in Blockbench)
        var partOf = { String name ->
            switch (name) {
                case "copy_walls": return "walls"
                case "flat_lid": return "lid"
                case "hinges": return "hinges"
                case "west_pin": case "east_pin": case "insulators": return "pins"
                default: throw new GradleException("embedded_connector.json: unknown element '${name}' (add it to generateEmbeddedConnectorModels)")
            }
        }
        var copy = { Object o -> new groovy.json.JsonSlurper().parseText(groovy.json.JsonOutput.toJson(o)) }
        var part = { String name ->
            copy(source.elements.findAll { partOf(it.name) == name }).each { element ->
                element.faces.values().each { it.remove("cullface") }
            }
        }
        var lidTexture = source.textures["0"]
        // Power Grid's wire_connector.png: copper for the pins, grey for the insulators
        var cpgPins = part("pins").each { element ->
            element.faces.each { side, face ->
                if (element.name == "insulators") {
                    face.uv = side in ["up", "down"] ? [4, 7, 6, 9] : [4, 7, 6, 7.5]
                } else {
                    face.uv = [5, 4, 6, 5]
                }
            }
        }
        var walls = part("walls").each { element ->
            element.faces.values().each { it.texture = "#wall"; it.remove("uv") }
        }
        var pivot = source.elements.find { it.name == "flat_lid" }.rotation.origin
        var write = { String path, Map json ->
            var out = outDir.get().file("assets/createinteroperable/models/${path}.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
        }
        var lidTextures = ["0": lidTexture, particle: lidTexture]
        write("block/embedded_connector/lid", [textures: lidTextures, elements: part("lid")])
        write("block/embedded_connector/lid_open", [
                loader   : "neoforge:elements",
                transform: [rotation: [y: embeddedConnectorLidOpenDegrees], origin: pivot.collect { it / 16 }],
                textures : lidTextures,
                elements : part("lid")])
        write("block/embedded_connector/hinges", [textures: lidTextures, elements: part("hinges")])
        var grids = [cee: [texture: "electroenergetics:block/connector", pins: part("pins")],
                     cpg: [texture: "powergrid:block/wire_connector", pins: cpgPins]]
        grids.each { grid, spec ->
            write("block/embedded_connector/${grid}_pins", [textures: ["1": spec.texture, particle: spec.texture], elements: spec.pins])
            write("item/${grid}_embedded_connector", [
                    parent  : "minecraft:block/block",
                    textures: ["0": lidTexture, "1": spec.texture, wall: "minecraft:block/polished_andesite",
                               particle: "minecraft:block/polished_andesite"],
                    elements: walls + part("lid") + part("hinges") + spec.pins,
                    // the opening faces south in the model: turn it toward the viewer
                    display : [gui  : [rotation: [30, 45, 0], translation: [0, 0, 0], scale: [0.625, 0.625, 0.625]],
                               fixed: [rotation: [0, 180, 0], translation: [0, 0, 0], scale: [0.5, 0.5, 0.5]]]])
        }
    }
}
