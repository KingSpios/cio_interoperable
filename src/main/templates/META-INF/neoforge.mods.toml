modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    credits='''${mod_credits}'''
    description='''${mod_description}'''

[[mixins]]
    config="createinteroperable.mixin.json"

# Optional Power Grid integration: PG's own ThermalBehaviour (the thermal sim
# backing overheat/fault mechanics on the Redstone Switch, Power Kits, and
# Rectifiers) picks its cooling baseline once per component via its own
# crude biome-only formula. When Cold Sweat is also present, this redirects
# that one baseline read to Cold Sweat's real ambient-temperature calculation
# instead (see com.cio.createinteroperable.mixin.powergrid), so a component
# sitting somewhere genuinely hot, cold, or Steam Hearth-warmed heats up and
# cools down accordingly. Name-targeted, non-required — a complete no-op
# without Power Grid, and falls back to PG's own formula unchanged without
# Cold Sweat.
[[mixins]]
    config="createinteroperable.powergrid.mixin.json"

# Optional Electro Energetics <-> Cold Sweat: CEE component overheating (its
# static ElectricalDevice#handleTemp) is shifted by Cold Sweat's temperature at
# the device's own coordinate, like the PG baseline above (see
# com.cio.createinteroperable.mixin.cee). Non-required, no-op without both.
[[mixins]]
    config="createinteroperable.cee.mixin.json"

# Experimental Pantographs & Wires / Electro Energetics conductor bridge.
# Guarded by PnwMixinPlugin, so it is inert unless both optional mods load.
[[mixins]]
    config="createinteroperable.pnw.mixin.json"

# Electro Energetics' Electric Pump under Create: Pipes n Physics: stops PnP's
# AUTO pump/turbine dial from resolving it to a turbine (see
# com.cio.createinteroperable.mixin.pnp). Guarded by PnpCeePumpMixinPlugin, so
# inert unless both optional mods load.
[[mixins]]
    config="createinteroperable.pnp.mixin.json"

# Aircon Motor as its own pump under Create: Pipes n Physics. Patches PnP's
# internal solver, so AirconEngineMixinPlugin applies it only to the PnP
# version it was written against (3.2.x); a no-op otherwise or without PnP
# (see com.cio.createinteroperable.mixin.pnpengine).
[[mixins]]
    config="createinteroperable.pnpengine.mixin.json"

# Optional Cold Sweat integration: makes Cold Sweat's own real
# WorldHelper#getInsulationAt (the lookup every position-based ambient
# temperature query — a real Cold Sweat Thermometer, and now PG's own
# ThermalBehaviour baseline above — uses to check "is a Hearth heating this
# spot") also recognize our own Steam Hearth's room, not just Cold Sweat's
# native HearthBlockEntity (see com.cio.createinteroperable.mixin.coldsweat).
# Name-targeted, non-required — a complete no-op without Cold Sweat.
[[mixins]]
    config="createinteroperable.coldsweat.mixin.json"

# Optional Let's Do (Farm & Charm / Alpine Whispers) sink + bathtub plumbing
# integration. Name-targeted, non-required mixins in a required=false config —
# a complete no-op when none of those mods are present, so Let's Do is never a
# hard dependency (see com.cio.createinteroperable.letsdo).
[[mixins]]
    config="createinteroperable.letsdo.mixin.json"

# The Crayfish-dependent slice of the Let's Do / Beachparty appliance
# integration (gramophone / radio / mini-fridge become electricity consumers).
# Same CrayfishMixinPlugin gate as below; a no-op without Refurbished Furniture.
[[mixins]]
    config="createinteroperable.letsdo.crayfish.mixin.json"

# MrCrayfish's Refurbished Furniture electricity + water-fixture integration.
# Every mixin here hard-references com.mrcrayfish.* and is disabled wholesale by
# CrayfishMixinPlugin when Refurbished Furniture is absent, so Crayfish is a soft
# (type="optional") dependency rather than a hard one.
[[mixins]]
    config="createinteroperable.crayfish.mixin.json"

# Optional Urban Decor integration. First fix: its faucet/sink/shower toggle
# never actually changed the block (client-only, discarded setValue result).
# Name-targeted, non-required — a complete no-op without Urban Decor (see
# com.cio.createinteroperable.mixin.urbandecor).
[[mixins]]
    config="createinteroperable.urbandecor.mixin.json"

# Optional Create Train Navigator integration: a freestanding Advanced Display
# only renders its texts while powered from a Domestic Electrical Board.
# Name-targeted, non-required — a complete no-op without Create Train Navigator
# (see com.cio.createinteroperable.mixin.crn).
[[mixins]]
    config="createinteroperable.crn.mixin.json"

# The Crayfish-dependent slice of the Create Train Navigator display integration
# (the display node also driven through Crayfish's own electricity graph + node
# renderer). Same CrayfishMixinPlugin gate; a no-op without Refurbished Furniture.
[[mixins]]
    config="createinteroperable.crn.crayfish.mixin.json"

# Optional Vista (cameramod) integration: a TV (single, or grown into a
# connected N x N wall) becomes a Domestic Electrical Board electricity
# consumer, billed n^2 the base rate for a grown wall. With no power it is
# always off; with power it defaults on, and redstone is repurposed as a
# manual kill switch instead of an on-switch. Name-targeted, non-required — a
# complete no-op without Vista (see com.cio.createinteroperable.mixin.vista).
[[mixins]]
    config="createinteroperable.vista.mixin.json"

# The Crayfish-dependent slice of the Vista TV integration (the TV node also
# driven through Crayfish's own electricity graph). Same CrayfishMixinPlugin
# gate; a no-op without Refurbished Furniture.
[[mixins]]
    config="createinteroperable.vista.crayfish.mixin.json"

# PURELY EXPERIMENTAL (experimental branch only, untested in real play)
# Optional Immersive Vehicles (formerly MTS) integration: a ground-placed MTS
# Official Content Pack AA Base Plate gets a wireable power terminal, and the
# AA Spotlight mounted on it needs a live Domestic Electrical Board rail to light
# its beam, auto-rotate or traverse at all. IV pole blocks and the Signal
# Controller become wireable nodes too, and street lights / traffic signals on a
# pole light only while that pole is powered. Guarded by MtsMixinPlugin — a
# complete no-op without Immersive Vehicles (see com.cio.createinteroperable.mts).
[[mixins]]
    config="createinteroperable.mts.mixin.json"

# The Crayfish-dependent slice of the Immersive Vehicles integration: IV's pole
# and Signal Controller block entities also become Crayfish electricity nodes.
# Guarded by MtsCrayfishMixinPlugin — a no-op without both mods.
[[mixins]]
    config="createinteroperable.mts.crayfish.mixin.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft dependency. Either Power Grid or Electro Energetics (or both) must be
# present — "neither" is unsupported and logged loudly at construction
# (CreateInteroperable) rather than supported. When present, this mod builds
# real terminals/blocks/BlockEntities against Power Grid's API (see
# com.cio.createinteroperable.compat.PowerGridCompat, checked at every
# PG-coupled registration site). When absent, all of that is skipped and the
# mod still loads for whatever Electro Energetics-only features it has.
[[dependencies.${mod_id}]]
    modId="powergrid"
    type="optional"
    versionRange="${power_grid_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft dependency, mirroring Power Grid above (see
# com.cio.createinteroperable.compat.ElectroEnergeticsCompat). When absent,
# this mod's own SimulatedDeviceType registrations (CIODevices) are skipped
# entirely rather than crashing at construction.
[[dependencies.${mod_id}]]
    modId="electroenergetics"
    type="optional"
    versionRange="${electro_energetics_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pantographsandwires"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependency. When present, the Domestic Electrical Board and every
# third-party appliance/lamp integration run on Crayfish's own electricity node
# graph, exactly as before (see com.cio.createinteroperable.mixin.crayfish and
# the crayfish-gated half of com.cio.createinteroperable.deb). When absent, all
# of that code is skipped (CrayfishMixinPlugin + com.cio.createinteroperable.grid
# .CrayfishCompat) and the mod still loads for its Power Grid <-> Electro
# Energetics bridging; a native appliance grid backend is Phase 2.
[[dependencies.${mod_id}]]
    modId="refurbished_furniture"
    type="optional"
    versionRange="${refurbished_furniture_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft dependency. When present, the steam-heating family (Brass Heater, Multi
# Radiator) registers real heat sources with Cold Sweat via the public
# BlockTempRegisterEvent (see com.cio.createinteroperable.compat.ColdSweatIntegration,
# gated on com.cio.createinteroperable.compat.ColdSweatCompat). When absent,
# that registration is skipped entirely and the mod still loads normally.
[[dependencies.${mod_id}]]
    modId="cold_sweat"
    type="optional"
    versionRange="${cold_sweat_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft dependency. When present, this mod's own fluid-handler blocks (Steam
# Outlet, Brass Heater, Multi Radiator) declare their PnP role explicitly
# (see com.cio.createinteroperable.compat.PipesNPhysicsIntegration, gated on
# com.cio.createinteroperable.compat.PipesNPhysicsCompat) so PnP's own
# behavioural relay detector never misclassifies a block that fills its own
# buffer from production (not from a pipe transfer) as a bottomless relay.
# When absent, that registration is skipped entirely and the mod still loads
# normally — PnP is otherwise fluid-agnostic and needs nothing else from us.
[[dependencies.${mod_id}]]
    modId="pipesnphysics"
    type="optional"
    versionRange="${pipes_n_physics_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft dependency. When present, an answered Telephone call carries nearby players'
# voice between the two phones (see com.cio.createinteroperable.voice). Simple Voice
# Chat discovers CioVoicechatPlugin itself; nothing else in this mod touches its API.
[[dependencies.${mod_id}]]
    modId="voicechat"
    type="optional"
    versionRange="${voicechat_version_range}"
    ordering="AFTER"
    side="BOTH"
