# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=true

# Minecraft / NeoForge — must match Power Grid's architectury-1.21.1/dev branch
# and Create: Electro Energetics' 1.21.1 branch exactly, or the compile-time
# classes pulled from both mods' jars will not line up with what's on the classpath.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
neo_version_range=[21.1.174,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod properties
mod_id=createinteroperable
mod_name=Create: Interoperable
mod_license=MIT
mod_version=0.1.5
mod_group_id=com.cio.createinteroperable
mod_authors=KingSpios
mod_credits=Bridges Create: Power Grid by patryk3211 and Create: Electro Energetics by \
george_vi; the Domestic Electrical Board plugs into MrCrayfish's Refurbished Furniture \
electricity system. Built with Claude Code (Anthropic).
mod_description=Bridges the Create electrical addons: maps Create: Power Grid and \
Create: Electro Energetics voltage 1:1, and steps Power Grid down into MrCrayfish's \
Refurbished Furniture electricity through the Domestic Electrical Board / Power Kits. \
Also gives third-party furniture appliances a real power requirement on that grid \
(Let's Do Furniture gramophone, lamps, street lanterns, sinks & bathtubs; Candlelight \
and Another Furniture lamps; Alpine Whispers fairy lights; Let's Do Beachparty radio \
and mini fridge) as soft, no-op-if-absent integrations.

# Hard dependency version ranges (Create is a shared transitive dependency of both)
create_version_range=[6.0.7,6.1.0)
create_version=6.0.10-280
# Create's own transitive deps — needed explicitly since the Create dependency
# below is pulled in with transitive=false. Versions match CEE's own
# gradle.properties (its build.gradle depends on these same two).
ponder_version=1.0.82
flywheel_version=1.0.6

# Power Grid's own neoforge.mods.toml (architectury-1.21.1/dev branch) lists
# Architectury API as a REQUIRED runtime mod dependency — PG will refuse to
# load without it present, which means our dev run environment needs it too.
# Version matches PG's own gradle.properties on that branch.
architectury_api_version=13.0.8

# Power Grid — org.patryk3211.powergrid. Pinned to published CurseForge file
# 8648636 (version 0.6.0.1) in build.gradle; range starts there.
power_grid_version_range=[0.6.0.1,)
# Create: Electro Energetics — com.george_vi.electroenergetics. Pinned to
# published CurseForge file 8345582 (version 1.21.1-1.1.1) in build.gradle —
# NOT the 1.2.0 git HEAD this addon's code was verified against (see the
# note in build.gradle). Range starts at the published version we actually
# depend on; raise both together if you later switch to a newer jar.
electro_energetics_version_range=[1.21.1-1.1.1,)

# MrCrayfish's Furniture Mod: Refurbished — com.mrcrayfish.furniture.refurbished.
# Pinned to published CurseForge file 7473565 (jar name says 1.21.1-1.0.22) in
# build.gradle. Hard dependency of the Domestic Electrical Board feature.
# NOTE: the mod's own neoforge.mods.toml `version` is just "1.0.22" (the
# "1.21.1-" prefix is only in the filename), so the range must NOT carry it —
# Maven comparison reads 1.0.22 < 1.21.1-1.0.22 and refuses to load.
refurbished_furniture_version_range=[1.0.22,)
